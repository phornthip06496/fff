<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>สมัครสมาชิก – TechHub</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="register">
<header class="topbar"><a class="brand" href="index.html">TechHub</a></header>
<main class="wrap">
  <section class="card">
    <h1>สมัครสมาชิก</h1>
    <p class="lead">ใช้เวลาไม่ถึงหนึ่งนาที</p>
    <form id="register-form" novalidate>
      <label for="full_name">ชื่อ-นามสกุล</label>
      <input id="full_name" name="full_name" autocomplete="name" required>

      <label for="username">ชื่อผู้ใช้</label>
      <input id="username" name="username" autocomplete="username" placeholder="เช่น somchai_dev" required>
      <p class="hint">a-z, 0-9 และ _ ความยาว 3–20 ตัวอักษร</p>

      <label for="email">อีเมล</label>
      <input id="email" name="email" type="email" autocomplete="email" required>

      <label for="interest">หมวดที่สนใจ</label>
      <select id="interest" name="interest">
        <option value="programming">เขียนโปรแกรม</option>
        <option value="hardware">ฮาร์ดแวร์</option>
        <option value="network">เครือข่าย</option>
        <option value="security">ความปลอดภัย</option>
        <option value="ai">AI</option>
      </select>

      <label for="password">รหัสผ่าน</label>
      <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required>
      <p class="hint">อย่างน้อย 8 ตัวอักษร</p>

      <label for="confirm">ยืนยันรหัสผ่าน</label>
      <input id="confirm" name="confirm" type="password" autocomplete="new-password" required>

      <div id="msg" class="msg" role="alert" hidden></div>
      <button id="submit" class="btn btn-block" type="submit">สมัครสมาชิก</button>
    </form>
    <p class="alt">มีบัญชีแล้ว? <a href="login.html">เข้าสู่ระบบ</a></p>
  </section>
</main>
<script type="module" src="js/app.js"></script>
</body>
</html>
